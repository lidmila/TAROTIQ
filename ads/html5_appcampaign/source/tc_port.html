<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="ad.size" content="width=320,height=480">
<title>TAROTIQ</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:320px;height:480px;overflow:hidden;background:#0C0A08;font-family:Georgia,'Times New Roman',serif}
.ad{position:relative;width:320px;height:480px;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 0%,#241B14 0%,#16110C 48%,#0C0A08 100%)}
.wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:26px 18px 22px}
.logo{color:#D4AF37;font-weight:bold;letter-spacing:4px;font-size:15px}
.head{color:#F5ECD7;font-size:20px;text-align:center;margin-top:6px}
.head b{color:#E8C84A}
.row{display:flex;justify-content:center;gap:9px}
.card{width:80px;height:132px;border-radius:6px;overflow:hidden;border:1px solid #E8C84A;
  box-shadow:0 0 12px rgba(232,200,74,.45),0 6px 14px rgba(0,0,0,.5);
  opacity:0;transform:translateY(14px);animation:up .6s ease forwards}
.card:nth-child(1){animation-delay:.2s}
.card:nth-child(2){animation-delay:.5s}
.card:nth-child(3){animation-delay:.8s}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.labels{display:flex;justify-content:center;gap:9px;margin-top:5px}
.labels span{width:80px;text-align:center;color:#BFAE8E;font-size:9px;letter-spacing:1px}
.rev{color:#BFAE8E;font-style:italic;font-size:14px;text-align:center;margin-top:8px}
.cta{padding:11px 26px;border-radius:26px;color:#1A140C;font-weight:bold;font-size:15px;
  background:linear-gradient(135deg,#E8C84A,#C4963A 60%,#A08520);box-shadow:0 0 16px rgba(232,200,74,.4);
  animation:pz 1.6s ease-in-out 1.2s infinite}
@keyframes up{to{opacity:1;transform:translateY(0)}}
@keyframes pz{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.play{color:#8A7A60;font-size:11px;letter-spacing:1px}
.mid{display:flex;flex-direction:column;align-items:center}
</style>
</head>
<body>
<div class="ad">
  <div class="wrap">
    <div class="logo">TAROTIQ</div>
    <div class="head">Past &middot; Present &middot; <b>Future</b></div>
    <div class="mid">
      <div class="row">
        <div class="card"><img src="moon.png" alt=""></div>
        <div class="card"><img src="star.png" alt=""></div>
        <div class="card"><img src="sun.png" alt=""></div>
      </div>
      <div class="labels"><span>PAST</span><span>PRESENT</span><span>FUTURE</span></div>
      <div class="rev">Your story, revealed by AI</div>
    </div>
    <div class="cta">Get your free reading</div>
    <div class="play">Personal AI tarot &middot; Free to try</div>
  </div>
</div>
</body>
</html>
