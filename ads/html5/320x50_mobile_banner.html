<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="ad.size" content="width=320,height=50">
<title>TarotIQ – Mobile Banner</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  width:320px; height:50px; overflow:hidden;
  background:#09091c; cursor:pointer; user-select:none;
  display:flex; align-items:center;
}
.bg {
  position:absolute; inset:0;
  background:
    linear-gradient(90deg,rgba(60,20,120,.55) 0%,transparent 35%,transparent 65%,rgba(60,20,120,.4) 100%),
    #09091c;
  border-top:1px solid rgba(140,80,240,.25);
  border-bottom:1px solid rgba(140,80,240,.25);
}
.glow-sweep {
  position:absolute; top:0; bottom:0; width:60px;
  background:linear-gradient(90deg,transparent,rgba(168,85,247,.35),transparent);
  animation:sweep 4s linear infinite;
}
@keyframes sweep { 0%{left:-80px} 100%{left:360px} }
.star {
  position:absolute; border-radius:50%; background:#fff;
  animation:tw var(--d,3s) ease-in-out infinite;
}
@keyframes tw { 0%,100%{opacity:0} 50%{opacity:.6} }

/* Card thumbnail */
.card-thumb {
  position:relative; flex-shrink:0; margin-left:8px;
  width:28px; height:42px;
  border-radius:4px; overflow:hidden;
  border:1px solid rgba(160,110,255,.45);
  box-shadow:0 0 10px rgba(108,43,217,.4), 0 3px 10px rgba(0,0,0,.6);
  animation:float-card 3s ease-in-out infinite;
}
@keyframes float-card { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-2px)} }
.card-thumb img { width:100%; height:100%; object-fit:cover; display:block; }

/* Separator */
.sep {
  width:1px; height:30px; flex-shrink:0; margin:0 10px;
  background:linear-gradient(to bottom,transparent,rgba(140,80,240,.4),transparent);
}

/* Logo */
.logo { flex-shrink:0; }
.logo-name {
  font-family:Georgia,serif; font-size:15px; font-weight:700; letter-spacing:1px;
  background:linear-gradient(90deg,#c9940a,#f0d060);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  line-height:1;
}
.logo-sub {
  font-family:Arial,sans-serif; font-size:7.5px;
  color:rgba(200,170,255,.55); letter-spacing:1.5px;
  text-transform:uppercase; margin-top:2px;
}

.sep2 {
  width:1px; height:30px; flex-shrink:0; margin:0 10px;
  background:linear-gradient(to bottom,transparent,rgba(140,80,240,.35),transparent);
}

/* Rotating copy */
.copy { flex:1; overflow:hidden; position:relative; height:32px; }
.copy-line {
  position:absolute; width:100%; left:0;
  font-family:Arial,sans-serif; font-size:10px; font-weight:600;
  color:rgba(225,210,255,.9); white-space:nowrap;
  top:50%; transform:translateY(-50%);
  opacity:0; transition:opacity .5s;
}
.copy-line.active { opacity:1; }
.copy-sub {
  position:absolute; bottom:2px; left:0;
  font-family:Arial,sans-serif; font-size:7.5px;
  color:rgba(180,150,255,.5); letter-spacing:.8px;
}

/* CTA */
.cta {
  flex-shrink:0; margin-right:8px;
  padding:7px 13px; border-radius:16px;
  background:linear-gradient(135deg,#6d28d9,#a855f7);
  color:#fff; font-family:Arial,sans-serif;
  font-size:10px; font-weight:700; letter-spacing:1px;
  text-transform:uppercase; white-space:nowrap;
  border:1px solid rgba(255,255,255,.2);
  box-shadow:0 2px 12px rgba(109,40,217,.6);
  animation:pulse-cta 2.5s ease-in-out infinite;
}
@keyframes pulse-cta {
  0%,100%{box-shadow:0 2px 12px rgba(109,40,217,.6)}
  50%{box-shadow:0 2px 20px rgba(168,85,247,.9)}
}
</style>
</head>
<body>
<div class="bg"></div>
<div class="glow-sweep"></div>
<div id="sf"></div>

<div class="card-thumb">
  <img src="major_arcana_x22_17.jpg" alt="Tarot">
</div>

<div class="sep"></div>

<div class="logo">
  <div class="logo-name">TarotIQ</div>
  <div class="logo-sub">AI Tarot</div>
</div>

<div class="sep2"></div>

<div class="copy">
  <div class="copy-line active" id="cl0">Free Daily Card · Reveal Your Path</div>
  <div class="copy-line" id="cl1">16 Spreads · Love, Career & Purpose</div>
  <div class="copy-line" id="cl2">Ancient Wisdom · Modern AI</div>
</div>

<div class="cta" id="cta">Try Free →</div>

<script>
var clickTag="";
var sf=document.getElementById('sf');
for(var i=0;i<14;i++){
  var s=document.createElement('div'); s.className='star';
  var sz=(Math.random()*1.5+.5)+'px';
  s.style.cssText='width:'+sz+';height:'+sz+';left:'+Math.random()*100+'%;top:'+Math.random()*100+'%;';
  s.style.setProperty('--d',(2+Math.random()*3)+'s');
  s.style.animationDelay=(Math.random()*3)+'s';
  sf.appendChild(s);
}
var lines=document.querySelectorAll('.copy-line');
var ci=0;
setInterval(function(){
  lines[ci].classList.remove('active');
  ci=(ci+1)%lines.length;
  lines[ci].classList.add('active');
},3000);
document.getElementById('cta').addEventListener('click',function(e){e.stopPropagation();window.open(clickTag);});
document.body.addEventListener('click',function(){window.open(clickTag);});
</script>
</body>
</html>
