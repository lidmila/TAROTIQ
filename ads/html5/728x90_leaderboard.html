<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="ad.size" content="width=728,height=90">
<title>TarotIQ – Leaderboard</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  width:728px; height:90px; overflow:hidden;
  background:#080818; cursor:pointer; user-select:none;
}
.bg {
  position:absolute; inset:0;
  background:
    linear-gradient(90deg,rgba(55,15,110,.65) 0%,transparent 28%,transparent 72%,rgba(55,15,110,.5) 100%),
    radial-gradient(ellipse at 14% 50%,rgba(108,43,217,.2) 0%,transparent 45%),
    radial-gradient(ellipse at 86% 50%,rgba(108,43,217,.15) 0%,transparent 40%),
    #080818;
  border-top:1px solid rgba(140,80,240,.2);
  border-bottom:1px solid rgba(140,80,240,.2);
}
.glow-sweep {
  position:absolute; top:0; bottom:0; width:80px;
  background:linear-gradient(90deg,transparent,rgba(168,85,247,.25),transparent);
  animation:sweep 6s linear infinite;
}
@keyframes sweep { 0%{left:-100px} 100%{left:800px} }
.star {
  position:absolute; border-radius:50%; background:#fff;
  animation:tw var(--d,3s) ease-in-out infinite;
}
@keyframes tw { 0%,100%{opacity:.05} 50%{opacity:.6} }

/* Logo zone */
.logo-zone {
  position:absolute; left:0; top:0; bottom:0; width:152px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:linear-gradient(90deg,rgba(35,8,75,.75) 0%,transparent 100%);
  padding:0 14px;
  border-right:1px solid rgba(140,80,240,.2);
}
.logo-name {
  font-family:Georgia,serif; font-size:22px; font-weight:700; letter-spacing:2px;
  background:linear-gradient(90deg,#b8860b,#f0d060);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  line-height:1;
}
.logo-sub {
  font-family:Arial,sans-serif; font-size:7.5px;
  color:rgba(200,170,255,.6); letter-spacing:2px;
  text-transform:uppercase; margin-top:4px;
}

.vdiv {
  position:absolute; top:12px; bottom:12px; width:1px;
  background:linear-gradient(to bottom,transparent,rgba(140,80,240,.4),transparent);
}

/* Card thumbnails */
.cards-zone {
  position:absolute; left:164px; top:0; bottom:0;
  display:flex; align-items:center; gap:9px;
}
.thumb {
  width:40px; height:66px; border-radius:5px; overflow:hidden; flex-shrink:0;
  border:1px solid rgba(160,110,255,.35);
  box-shadow:0 0 12px rgba(108,43,217,.3), 0 4px 14px rgba(0,0,0,.65);
  transition:transform .3s, box-shadow .3s;
}
.thumb:hover {
  transform:translateY(-3px);
  box-shadow:0 0 20px rgba(168,85,247,.5), 0 6px 18px rgba(0,0,0,.7);
}
.thumb img { width:100%; height:100%; object-fit:cover; display:block; }

/* Feature pills */
.pills {
  position:absolute; left:310px; top:50%; transform:translateY(-50%);
  display:flex; flex-direction:column; gap:5px;
}
.pill {
  display:flex; align-items:center; gap:5px;
  padding:3px 9px; border-radius:10px;
  background:rgba(140,80,240,.1);
  border:1px solid rgba(140,80,240,.22);
}
.pill-icon { font-size:11px; }
.pill-text {
  font-family:Arial,sans-serif; font-size:9px;
  color:rgba(210,190,255,.8); letter-spacing:.4px; white-space:nowrap;
}

/* Rotating headline */
.headline-zone {
  position:absolute; left:455px; right:165px; top:0; bottom:0;
  display:flex; align-items:center; overflow:hidden; padding:0 8px;
}
.headline {
  position:absolute; width:100%;
  font-family:Georgia,serif; font-size:14px; font-weight:700;
  color:rgba(235,215,255,.95); line-height:1.3;
  opacity:0; text-align:center;
  animation:slide-h 9s ease-in-out infinite;
}
.headline:nth-child(2){animation-delay:3s;}
.headline:nth-child(3){animation-delay:6s;}
@keyframes slide-h {
  0%,5%{opacity:0;transform:translateY(10px)}
  15%,35%{opacity:1;transform:translateY(0)}
  40%,100%{opacity:0;transform:translateY(-10px)}
}

/* CTA zone */
.cta-zone {
  position:absolute; right:0; top:0; bottom:0; width:150px;
  display:flex; align-items:center; justify-content:center;
  background:linear-gradient(90deg,transparent,rgba(35,8,75,.5));
}
.cta {
  padding:10px 18px; border-radius:22px;
  background:linear-gradient(135deg,#6d28d9,#a855f7);
  color:#fff; font-family:Arial,sans-serif;
  font-size:11px; font-weight:700; letter-spacing:1.5px;
  text-transform:uppercase; white-space:nowrap;
  border:1px solid rgba(255,255,255,.2);
  box-shadow:0 3px 18px rgba(109,40,217,.6);
  animation:pulse-cta 2.5s ease-in-out infinite;
  transition:transform .2s;
}
.cta:hover { transform:scale(1.04); }
@keyframes pulse-cta {
  0%,100%{box-shadow:0 3px 18px rgba(109,40,217,.6)}
  50%{box-shadow:0 3px 28px rgba(168,85,247,.9)}
}
</style>
</head>
<body>
<div class="bg"></div>
<div class="glow-sweep"></div>
<div id="sf"></div>

<div class="logo-zone">
  <div class="logo-name">TarotIQ</div>
  <div class="logo-sub">AI Tarot Readings</div>
</div>

<div class="vdiv" style="left:160px"></div>

<div class="cards-zone">
  <div class="thumb"><img src="major_arcana_x22_17.jpg" alt="The Star"></div>
  <div class="thumb"><img src="major_arcana_x22_18_v2.jpg" alt="The Moon"></div>
  <div class="thumb"><img src="major_arcana_x22_19.jpg" alt="The Sun"></div>
</div>

<div class="vdiv" style="left:308px"></div>

<div class="pills">
  <div class="pill"><span class="pill-icon">✦</span><span class="pill-text">Free Daily Card</span></div>
  <div class="pill"><span class="pill-icon">☽</span><span class="pill-text">16 Spreads</span></div>
</div>

<div class="vdiv" style="left:453px"></div>

<div class="headline-zone">
  <div class="headline">Your destiny is<br>waiting to be read.</div>
  <div class="headline">Love · Career · Purpose<br>Find clarity today.</div>
  <div class="headline">Ancient wisdom meets<br>modern AI.</div>
</div>

<div class="vdiv" style="left:575px"></div>

<div class="cta-zone">
  <div class="cta" id="cta">Read My Cards →</div>
</div>

<script>
var clickTag="";
var sf=document.getElementById('sf');
for(var i=0;i<22;i++){
  var s=document.createElement('div'); s.className='star';
  var sz=(Math.random()*1.5+.5)+'px';
  s.style.cssText='width:'+sz+';height:'+sz+';left:'+Math.random()*100+'%;top:'+Math.random()*100+'%;';
  s.style.setProperty('--d',(2+Math.random()*3.5)+'s');
  s.style.animationDelay=(Math.random()*4)+'s';
  sf.appendChild(s);
}
document.getElementById('cta').addEventListener('click',function(e){e.stopPropagation();window.open(clickTag);});
document.body.addEventListener('click',function(){window.open(clickTag);});
</script>
</body>
</html>
