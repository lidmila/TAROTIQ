<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="ad.size" content="width=300,height=250">
<title>TarotIQ – Card Reveal</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:300px; height:250px; overflow:hidden; background:#07071a; cursor:pointer; user-select:none; }

.bg {
  position:absolute; inset:0;
  background:
    radial-gradient(ellipse at 22% 55%, rgba(88,28,180,.22) 0%, transparent 55%),
    radial-gradient(ellipse at 78% 20%, rgba(140,60,220,.14) 0%, transparent 45%),
    radial-gradient(ellipse at 50% 100%, rgba(30,8,70,.5) 0%, transparent 38%),
    #07071a;
}
/* Table felt */
.table { position:absolute; bottom:0; left:0; right:0; height:80px; background:linear-gradient(to top,rgba(12,4,30,.85) 0%,transparent 100%); border-top:1px solid rgba(120,60,220,.12); }

.star { position:absolute; border-radius:50%; background:#fff; animation:tw var(--d,3s) ease-in-out infinite; }
@keyframes tw { 0%,100%{opacity:.07} 50%{opacity:.8} }

/* Particle canvas */
canvas { position:absolute; inset:0; pointer-events:none; z-index:80; }

/* Cards */
.cards { position:absolute; top:18px; left:0; right:0; display:flex; justify-content:center; gap:11px; overflow:visible; }

/* Entry animations */
@keyframes deal0 { from{transform:translateY(-85px) translateX(-28px) rotate(-20deg);opacity:0} to{transform:none;opacity:1} }
@keyframes deal1 { from{transform:translateY(-85px) rotate(0deg);opacity:0} to{transform:none;opacity:1} }
@keyframes deal2 { from{transform:translateY(-85px) translateX(28px) rotate(20deg);opacity:0} to{transform:none;opacity:1} }

.card-wrap {
  position:relative; flex-shrink:0; width:76px; height:128px; opacity:0;
  transition:transform .45s cubic-bezier(.34,1.45,.64,1), filter .4s, opacity .35s;
}
.card-wrap.w0 { animation:deal0 .55s .35s cubic-bezier(.2,.85,.3,1) forwards; }
.card-wrap.w1 { animation:deal1 .55s .6s cubic-bezier(.2,.85,.3,1) forwards; }
.card-wrap.w2 { animation:deal2 .55s .85s cubic-bezier(.2,.85,.3,1) forwards; }

.card-wrap.active { transform:translateY(-10px) scale(1.1); z-index:20; }
.cards.dim .card-wrap:not(.active) { opacity:.5; filter:brightness(.6) saturate(.65); }

/* 3D */
.card { width:76px; height:128px; perspective:700px; }
.card-inner { width:100%; height:100%; position:relative; transform-style:preserve-3d; transition:transform .8s cubic-bezier(.4,0,.2,1); }
.card-inner.flipped { transform:rotateY(180deg); }
.card-face { position:absolute; inset:0; backface-visibility:hidden; border-radius:7px; overflow:hidden; border:1px solid rgba(140,80,240,.38); box-shadow:0 8px 24px rgba(0,0,0,.8); transition:border-color .4s, box-shadow .4s; }
.card-front { transform:rotateY(180deg); }
.card-face img { width:100%; height:100%; object-fit:cover; display:block; }
img.rev { transform:rotate(180deg); }

.card-wrap.active .card-face { border-color:rgba(212,175,55,.7); box-shadow:0 0 22px rgba(212,175,55,.32), 0 12px 32px rgba(0,0,0,.85); }

/* Badge inside front face */
.badge { position:absolute; bottom:0; left:0; right:0; padding:28px 5px 6px; background:linear-gradient(to top,rgba(3,1,15,.97) 0%,transparent 100%); border-radius:0 0 6px 6px; text-align:center; opacity:0; transition:opacity .45s .7s; }
.card-wrap.active .badge { opacity:1; }
.badge-name { font-family:Georgia,serif; font-size:7.5px; font-weight:700; color:#e0bb38; letter-spacing:1px; text-transform:uppercase; line-height:1.3; }
.badge-orient { font-family:Arial,sans-serif; font-size:6.5px; color:rgba(200,175,255,.65); letter-spacing:1.8px; text-transform:uppercase; margin-top:2px; }

/* Hint */
.hint { position:absolute; top:155px; left:0; right:0; text-align:center; font-family:Arial,sans-serif; font-size:8px; color:rgba(180,130,255,.55); letter-spacing:2.5px; text-transform:uppercase; animation:pulse-h 2s ease-in-out infinite; transition:opacity .5s; }
.hint.gone { opacity:0; animation:none; }
@keyframes pulse-h { 0%,100%{opacity:.4} 50%{opacity:.85} }

/* Text */
.headline { position:absolute; top:168px; left:10px; right:10px; text-align:center; font-family:Georgia,serif; font-size:15px; font-weight:700; background:linear-gradient(90deg,#a07010,#f0d060,#a07010); -webkit-background-clip:text; -webkit-text-fill-color:transparent; animation:shimmer 3s ease-in-out infinite; }
@keyframes shimmer { 0%,100%{filter:brightness(1)} 50%{filter:brightness(1.3)} }
.sub { position:absolute; top:189px; left:16px; right:16px; text-align:center; font-family:Arial,sans-serif; font-size:9.5px; color:rgba(200,175,255,.7); line-height:1.4; }

/* CTA */
.cta { position:absolute; bottom:10px; left:50%; transform:translateX(-50%); padding:9px 24px; border-radius:22px; background:linear-gradient(135deg,#6d28d9,#a855f7); color:#fff; font-family:Arial,sans-serif; font-size:11px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; white-space:nowrap; border:1px solid rgba(255,255,255,.2); box-shadow:0 4px 20px rgba(109,40,217,.55); animation:pulse-cta 2.5s ease-in-out infinite; }
@keyframes pulse-cta { 0%,100%{box-shadow:0 4px 20px rgba(109,40,217,.55)} 50%{box-shadow:0 4px 32px rgba(168,85,247,.85)} }
</style>
</head>
<body>
<div class="bg"></div>
<div class="table"></div>
<div id="sf"></div>
<canvas id="pfx" width="300" height="250"></canvas>

<div class="cards" id="cards">
  <div class="card-wrap w0" data-idx="0">
    <div class="card"><div class="card-inner" id="c0">
      <div class="card-face"><img src="card-back.png" alt=""></div>
      <div class="card-face card-front">
        <img id="img0" src="major_arcana_x22_17.jpg" alt="">
        <div class="badge"><div class="badge-name">The Star</div><div class="badge-orient" id="bo0"></div></div>
      </div>
    </div></div>
  </div>
  <div class="card-wrap w1" data-idx="1">
    <div class="card"><div class="card-inner" id="c1">
      <div class="card-face"><img src="card-back.png" alt=""></div>
      <div class="card-face card-front">
        <img id="img1" src="major_arcana_x22_18_v2.jpg" alt="">
        <div class="badge"><div class="badge-name">The Moon</div><div class="badge-orient" id="bo1"></div></div>
      </div>
    </div></div>
  </div>
  <div class="card-wrap w2" data-idx="2">
    <div class="card"><div class="card-inner" id="c2">
      <div class="card-face"><img src="card-back.png" alt=""></div>
      <div class="card-face card-front">
        <img id="img2" src="major_arcana_x22_19.jpg" alt="">
        <div class="badge"><div class="badge-name">The Sun</div><div class="badge-orient" id="bo2"></div></div>
      </div>
    </div></div>
  </div>
</div>

<div class="hint" id="hint">Tap a Card · Reveal Your Path</div>
<div class="headline">Your Reading Awaits</div>
<div class="sub">AI-powered tarot · Personalized insights</div>
<div class="cta" id="cta">Free Daily Card →</div>

<script>
var clickTag = "";

// Stars
var sf=document.getElementById('sf');
for(var i=0;i<40;i++){
  var s=document.createElement('div');s.className='star';
  var sz=(Math.random()*2+.8)+'px';
  s.style.cssText='width:'+sz+';height:'+sz+';left:'+Math.random()*100+'%;top:'+Math.random()*100+'%;';
  s.style.setProperty('--d',(2.5+Math.random()*3.5)+'s');
  s.style.animationDelay=(Math.random()*4)+'s';
  sf.appendChild(s);
}

// Particles
var canvas=document.getElementById('pfx');
var ctx=canvas.getContext('2d');
var particles=[];
var rafID=null;

function spawnBurst(x,y){
  var colors=['rgba(212,175,55,','rgba(168,85,247,','rgba(240,210,100,'];
  for(var i=0;i<28;i++){
    var ang=Math.random()*Math.PI*2;
    var spd=Math.random()*3.5+1;
    particles.push({
      x:x,y:y,
      vx:Math.cos(ang)*spd,
      vy:Math.sin(ang)*spd-2,
      life:1,
      decay:Math.random()*.022+.016,
      r:Math.random()*3+1,
      col:colors[Math.floor(Math.random()*colors.length)]
    });
  }
  if(!rafID) rafLoop();
}
function rafLoop(){
  ctx.clearRect(0,0,300,250);
  for(var i=particles.length-1;i>=0;i--){
    var p=particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.09; p.life-=p.decay;
    if(p.life<=0){particles.splice(i,1);continue;}
    ctx.globalAlpha=p.life*p.life;
    ctx.fillStyle=p.col+p.life+')';
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.28);ctx.fill();
  }
  ctx.globalAlpha=1;
  rafID=particles.length?requestAnimationFrame(rafLoop):(rafID=null);
}

// Card state
var state=[false,false,false];
var hint=document.getElementById('hint');
var cardsEl=document.getElementById('cards');
var wraps=document.querySelectorAll('.card-wrap');
var autoTid;

function cardCenter(wrap){
  // positions are in the ad's coordinate space
  var idx=parseInt(wrap.dataset.idx);
  var gaps=11, w=76, total=w*3+gaps*2;
  var startX=(300-total)/2;
  var cx=startX+idx*(w+gaps)+w/2;
  return{x:cx,y:18+64}; // card top + half height
}

function flip(idx,val){
  var wrap=wraps[idx]; state[idx]=val;
  var inner=document.getElementById('c'+idx);
  var img=document.getElementById('img'+idx);
  var bo=document.getElementById('bo'+idx);
  if(val){
    var rev=Math.random()<.33;
    img.className=rev?'rev':'';
    bo.textContent=rev?'Obrácená':'Vzpřímená';
    inner.classList.add('flipped');
    wrap.classList.add('active');
    cardsEl.classList.add('dim');
    var c=cardCenter(wrap);
    spawnBurst(c.x,c.y);
    setTimeout(function(){spawnBurst(c.x,c.y);},250);
  } else {
    inner.classList.remove('flipped');
    wrap.classList.remove('active');
    img.className='';
    if(!state[0]&&!state[1]&&!state[2]) cardsEl.classList.remove('dim');
  }
}

function autoLoop(){
  flip(0,false);flip(1,false);flip(2,false);
  cardsEl.classList.remove('dim');
  hint.classList.remove('gone');
  autoTid=setTimeout(function(){
    flip(0,true);
    autoTid=setTimeout(function(){
      flip(1,true);
      autoTid=setTimeout(function(){
        flip(2,true);
        hint.classList.add('gone');
        autoTid=setTimeout(autoLoop,4500);
      },950);
    },950);
  },2000);
}
autoLoop();

cardsEl.addEventListener('click',function(e){
  var wrap=e.target.closest('.card-wrap');
  if(!wrap) return;
  clearTimeout(autoTid);
  var idx=parseInt(wrap.dataset.idx);
  flip(idx,!state[idx]);
  hint.classList.toggle('gone',state[0]||state[1]||state[2]);
});
document.getElementById('cta').addEventListener('click',function(e){e.stopPropagation();window.open(clickTag);});
document.body.addEventListener('click',function(e){if(!e.target.closest('#cards')&&!e.target.closest('#cta'))window.open(clickTag);});
</script>
</body>
</html>
