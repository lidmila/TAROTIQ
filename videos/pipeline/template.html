<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TAROTIQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Marcellus&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0C0A08}
/* Palette: Void #0C0A08, Deep #15110D, Mid #1E1814, Surface #2A2118
   Gold: AstralGlow #E8C84A, CelestialGold #D4AF37, AstralPurple #C4963A, Bronze #8B5A2B
   Text: StarWhite #F5ECD7, MoonSilver #BFAE8E, Dim #8A7A60 */
.stage{position:relative;width:1080px;height:1920px;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 16%, #221A14 0%, #17120D 44%, #0C0A08 100%);}
.stars{position:absolute;inset:0;z-index:1}
.star{position:absolute;border-radius:50%;background:#F5ECD7;box-shadow:0 0 6px rgba(232,200,74,.6)}
/* Nebulas use a static radial gradient instead of an expensive per-frame blur()
   filter — visually equivalent, but the browser caches the layer so screenshots
   are ~5x faster. */
.nebula{position:absolute;border-radius:50%}
.neb1{width:1040px;height:1040px;top:-330px;right:-330px;
  background:radial-gradient(circle,rgba(196,150,58,.30),rgba(196,150,58,.10) 45%,transparent 68%)}
.neb2{width:960px;height:960px;bottom:-320px;left:-340px;
  background:radial-gradient(circle,rgba(139,90,43,.28),rgba(139,90,43,.08) 45%,transparent 68%)}
/* anti-banding grain overlay — dithers dark gradients so they don't posterize */
.grain{position:absolute;inset:-20%;z-index:38;pointer-events:none;opacity:.05;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");}
.vignette{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 80% at 50% 42%, transparent 46%, rgba(0,0,0,.5) 100%);z-index:39}

.logo{position:absolute;top:150px;left:0;right:0;text-align:center;z-index:20}
.logo-text{font-family:'Marcellus',serif;font-size:44px;letter-spacing:18px;color:#D4AF37;
  text-shadow:0 0 30px rgba(212,175,55,.5);padding-left:18px}
.logo-rule{width:120px;height:1px;margin:22px auto 0;background:linear-gradient(90deg,transparent,#D4AF37,transparent)}

.headline{position:absolute;top:246px;left:0;right:0;text-align:center;z-index:20;padding:0 90px}
.headline h1{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:82px;line-height:1.12;color:#F5ECD7}
.headline em{font-style:italic;color:#E8C84A;font-weight:600}

.card-glow{position:absolute;top:49%;left:50%;transform:translate(-50%,-50%);
  width:640px;height:900px;border-radius:60px;z-index:8;
  background:radial-gradient(ellipse at center, rgba(232,200,74,.26), rgba(212,175,55,.07) 55%, transparent 72%)}
.card-wrap{position:absolute;top:49%;left:50%;transform:translate(-50%,-50%);perspective:2400px;z-index:12}
.card{width:452px;height:775px;position:relative;transform-style:preserve-3d}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;overflow:hidden;
  box-shadow:0 30px 80px rgba(0,0,0,.6)}
.face img{width:100%;height:100%;object-fit:cover;display:block}
.back{border:2px solid rgba(212,175,55,.45)}
.front{transform:rotateY(180deg);border:2.5px solid #E8C84A;
  box-shadow:0 0 60px rgba(232,200,74,.4),0 30px 80px rgba(0,0,0,.6)}

.card-name{position:absolute;top:72%;left:0;right:0;text-align:center;z-index:20;padding:0 40px}
.card-name span{font-family:'Marcellus',serif;font-size:58px;letter-spacing:5px;color:#E8C84A;
  text-shadow:0 0 30px rgba(232,200,74,.5);white-space:nowrap}
.reveal{position:absolute;top:77.5%;left:0;right:0;text-align:center;z-index:20;padding:0 110px}
.reveal span{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:46px;color:#BFAE8E}

.cta{position:absolute;bottom:206px;left:50%;transform:translateX(-50%);z-index:30}
.cta-btn{display:block;padding:34px 88px;border-radius:60px;white-space:nowrap;
  background:linear-gradient(135deg,#E8C84A,#C4963A 60%,#A08520);
  font-family:'Marcellus',serif;font-size:40px;letter-spacing:3px;color:#1A140C;
  box-shadow:0 0 60px rgba(232,200,74,.38),0 12px 30px rgba(0,0,0,.5)}
.playhint{position:absolute;bottom:128px;left:0;right:0;text-align:center;z-index:30}
.playhint span{font-family:'Cormorant Garamond',serif;font-size:34px;letter-spacing:2px;color:#8A7A60}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="stars" id="stars"></div>
  <div class="nebula neb1" id="neb1"></div>
  <div class="nebula neb2" id="neb2"></div>

  <div class="logo" id="logo"><div class="logo-text">TAROTIQ</div><div class="logo-rule"></div></div>
  <div class="headline" id="headline"><h1></h1></div>

  <div class="card-glow" id="glow"></div>
  <div class="card-wrap" id="cardwrap">
    <div class="card" id="card">
      <div class="face back"><img id="imgBack" src="hd/card_back.png" alt=""></div>
      <div class="face front"><img id="imgFront" src="" alt=""></div>
    </div>
  </div>

  <div class="card-name" id="cardname"><span></span></div>
  <div class="reveal" id="reveal"><span></span></div>

  <div class="cta" id="cta"><div class="cta-btn"></div></div>
  <div class="playhint" id="playhint"><span>Free on Google Play</span></div>

  <div class="vignette"></div>
  <div class="grain"></div>
</div>

<script>
// ---- variant catalogue (English copy) ----
var VARIANTS={
  star:{img:'hd/the_star.jpg',name:'THE STAR',h1:'What do the stars',em:'tell you?',
        reveal:'The stars have a message for you…',cta:'Try it free'},
  moon:{img:'hd/the_moon.jpg',name:'THE MOON',h1:'What hides in',em:'the shadows?',
        reveal:'Trust your intuition tonight…',cta:'Reveal your card'},
  sun:{img:'hd/the_sun.jpg',name:'THE SUN',h1:'What will',em:'light your day?',
        reveal:'Joy is written in your cards…',cta:'Start for free'},
  priestess:{img:'hd/the_high_priestess.jpg',name:'THE HIGH PRIESTESS',h1:'What does your',em:'intuition know?',
        reveal:'Secrets are ready to unfold…',cta:'Discover free',nameSize:'44px'},
  lovers:{img:'hd/the_lovers.jpg',name:'THE LOVERS',h1:'What does your',em:'heart seek?',
        reveal:'Love has a card for you…',cta:'Read for free'},
  fortune:{img:'hd/wheel_of_fortune.jpg',name:'WHEEL OF FORTUNE',h1:'What does fate',em:'hold for you?',
        reveal:'Destiny is turning in your favor…',cta:'Spin your fate',nameSize:'46px'}
};
var key=new URLSearchParams(location.search).get('v')||'star';
var C=VARIANTS[key]||VARIANTS.star;

document.getElementById('imgFront').src=C.img;
document.querySelector('#headline h1').innerHTML=C.h1+'<br><em>'+C.em+'</em>';
var nmeSpan=document.querySelector('#cardname span');
nmeSpan.textContent=C.name; if(C.nameSize)nmeSpan.style.fontSize=C.nameSize;
document.querySelector('#reveal span').textContent=C.reveal;
document.querySelector('.cta-btn').textContent=C.cta;

// ---- deterministic star layout ----
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
var rnd=mulberry32(1337),STAR=[];
(function(){var host=document.getElementById('stars');
  for(var i=0;i<120;i++){var d=document.createElement('div');d.className='star';
    var sz=1+rnd()*3.2;d.style.width=d.style.height=sz+'px';
    d.style.left=(rnd()*100)+'%';d.style.top=(rnd()*100)+'%';host.appendChild(d);
    STAR.push({el:d,base:.12+rnd()*.4,amp:.35+rnd()*.5,spd:.6+rnd()*1.6,ph:rnd()*6.28});
  }})();

function clamp(v,a,b){return v<a?a:v>b?b:v}
function p(t,s,e){return clamp((t-s)/(e-s),0,1)}
function eO(x){return 1-Math.pow(1-x,3)}
function eIO(x){return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2}
function L(a,b,x){return a+(b-a)*x}
var $=function(id){return document.getElementById(id)};
var logo=$('logo'),headline=$('headline'),cardwrap=$('cardwrap'),card=$('card'),
    glow=$('glow'),cardname=$('cardname'),reveal=$('reveal'),cta=$('cta'),
    playhint=$('playhint'),neb1=$('neb1'),neb2=$('neb2');

window.seek=function(t){
  var s=t/1000;
  for(var i=0;i<STAR.length;i++){var st=STAR[i];
    st.el.style.opacity=clamp(st.base+st.amp*(0.5+0.5*Math.sin(s*st.spd+st.ph)),0,1);}

  var lp=eO(p(t,200,1000));logo.style.opacity=lp;logo.style.transform='translateY('+L(-30,0,lp)+'px)';
  var hp=eO(p(t,900,1900));headline.style.opacity=hp;headline.style.transform='translateY('+L(34,0,hp)+'px)';

  var ap=eO(p(t,1700,2500));
  var flt=t>2500?Math.sin((t-2500)/1400)*10:0;
  cardwrap.style.opacity=ap;
  cardwrap.style.transform='translate(-50%,-50%) translateY('+(L(24,0,ap)+flt)+'px) scale('+L(.86,1,ap)+')';

  var gB=0.55+0.45*(0.5+0.5*Math.sin(s*1.6)),gBoost=L(0.6,1.15,p(t,3000,4200));
  glow.style.opacity=clamp(gB*gBoost,0,1)*ap;
  glow.style.transform='translate(-50%,-50%) scale('+(0.97+0.05*(0.5+0.5*Math.sin(s*1.6)))+')';

  card.style.transform='rotateY('+L(0,180,eIO(p(t,3000,4100)))+'deg)';

  var np=eO(p(t,4200,4800));cardname.style.opacity=np;cardname.style.transform='translateY('+L(18,0,np)+'px)';
  var rp=eO(p(t,4800,5600));reveal.style.opacity=rp;reveal.style.transform='translateY('+L(16,0,rp)+'px)';

  var cp=eO(p(t,5900,6600));
  var pulse=t>6600?1+0.03*(0.5+0.5*Math.sin((t-6600)/430)):1;
  cta.style.opacity=cp;cta.style.transform='translateX(-50%) translateY('+L(26,0,cp)+'px) scale('+(cp*pulse)+')';

  playhint.style.opacity=eO(p(t,6600,7300))*0.9;
};
window.seek(0);

window.__ready=(async function(){
  try{await document.fonts.ready;}catch(e){}
  var imgs=Array.prototype.slice.call(document.images);
  await Promise.all(imgs.map(function(im){return im.complete?Promise.resolve():new Promise(function(r){im.onload=im.onerror=r})}));
  return true;
})();
</script>
</body>
</html>
